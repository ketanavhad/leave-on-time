<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Transit Decision System</title>

<style>
:root {
  --bg:#0b0b0d;
  --card:#15151a;
  --text:#f0f0f0;
  --sub:#9a9aa0;
  --accent:#7b1e2b;
  --danger:#ff2a2a;
}

/* ================= BASE ================= */

body {
  margin:0;
  padding:28px;
  font-family:system-ui;
  background:var(--bg);
  color:var(--text);
  max-width:760px;
  margin:auto;
}

h2 { margin-bottom:18px; }

/* ================= MENU ================= */

.menu-btn {
  position:fixed;
  top:14px;
  right:14px;
  background:#202028;
  border:none;
  color:white;
  padding:10px 12px;
  cursor:pointer;
  z-index:20;
}

.menu {
  position:fixed;
  top:0;
  right:0;
  width:280px;
  height:100%;
  background:#111118;
  padding:16px;
  transform:translateX(100%);
  transition:.25s;
  z-index:19;
  overflow:auto;
}

.menu.open { transform:translateX(0); }

.menu h3 {
  font-size:12px;
  color:var(--sub);
  text-transform:uppercase;
  margin-top:20px;
}

.menu input {
  width:100%;
  padding:10px;
  margin-top:6px;
  margin-bottom:10px;
  background:#202028;
  border:none;
  color:white;
  font-size:16px;
}

/* ================= AUTOCOMPLETE ================= */

.suggest-box { position:relative; }

.suggest-list {
  position:absolute;
  top:42px;
  left:0;
  right:0;
  background:#14141a;
  border:1px solid #2a2a33;
  max-height:160px;
  overflow:auto;
  z-index:10;
}

.suggest-item {
  padding:10px;
  cursor:pointer;
}

.suggest-item:hover,
.suggest-item.active {
  background:var(--accent);
}

/* ================= CARDS ================= */

.card {
  background:var(--card);
  padding:16px;
  margin-bottom:14px;
  border-left:4px solid #333;
}

.active { border-left-color:var(--accent); }

.pulse {
  animation:pulse 1.2s infinite;
  border-left-color:var(--danger);
}

@keyframes pulse {
  50% { box-shadow:0 0 25px rgba(255,0,0,.4); }
}

.title {
  font-size:11px;
  color:var(--sub);
  letter-spacing:1.2px;
  text-transform:uppercase;
}

.big { font-size:18px; font-weight:700; margin-top:6px; }

.small { font-size:12px; color:var(--sub); margin-top:6px; }

/* ================= BAR ================= */

.bar-meter {
  display:flex;
  gap:4px;
  margin:10px 0;
  height:7px;
}

.bar {
  flex:1;
  background:#1a1a20;
}

.bar.on:nth-child(1){background:#ff6b6b}
.bar.on:nth-child(2){background:#ff4d4d}
.bar.on:nth-child(3){background:#ff2f2f}
.bar.on:nth-child(4){background:#e60000}
.bar.on:nth-child(5){background:#ff0000}

.bar-meter.critical .bar.on {
  box-shadow:0 0 16px rgba(255,0,0,.5);
}

/* ================= LIST ================= */

.section { margin-top:22px; }

.section-title {
  font-size:11px;
  color:var(--sub);
  text-transform:uppercase;
  margin-bottom:10px;
}

.row {
  display:grid;
  grid-template-columns:70px 1fr 80px;
  padding:10px;
  background:var(--card);
  margin-bottom:6px;
  opacity:.8;
}

.row.active-row {
  border-left:3px solid var(--accent);
  opacity:1;
}

</style>
</head>

<body>

<button class="menu-btn" onclick="toggleMenu()">☰</button>

<div class="menu" id="menu">
  <h3>Journey A → B (Work → Home)</h3>
  <div class="suggest-box">
    <input id="alexInput" placeholder="S+U Alexanderplatz Bhf (Berlin)" autocomplete="off">
    <input id="alexStopId" type="hidden">
    <div id="alexSuggest" class="suggest-list" style="display:none"></div>
  </div>
  <label>Time to reach station (min)</label>
  <input id="alexWalk" type="number">
  <label>Label</label>
  <input id="alexLabel">
  
  <h3>Journey B → A (Home → Work)</h3>
  <div class="suggest-box">
    <input id="samInput" placeholder="U Samariterstr. (Berlin)" autocomplete="off">
    <input id="samStopId" type="hidden">
    <div id="samSuggest" class="suggest-list" style="display:none"></div>
  </div>
  <label>Time to reach station (min)</label>
  <input id="samWalk" type="number">
  <label>Label</label>
  <input id="samLabel">
  
  <button onclick="start()">Save & Start</button>
</div>

<h2>Transit Decision System</h2>

<div id="commutes"></div>

<div class="section">
  <div class="section-title" id="alexTitle"></div>
  <div id="alexList"></div>
</div>

<div class="section">
  <div class="section-title" id="samTitle"></div>
  <div id="samList"></div>
</div>

<script>

/* ================= DEFAULTS ================= */

const DEFAULTS = {
  alex: {
    name: "S+U Alexanderplatz Bhf (Berlin)",
    stopId: "900100003",
    walk: 7,
    label: "WORK → HOME"
  },
  sam: {
    name: "U Samariterstr. (Berlin)",
    stopId: "900120009",
    walk: 9,
    label: "HOME → WORK"
  }
};

let CONFIG;

/* ================= STORAGE ================= */

function loadSettings(){
  const saved = localStorage.getItem("transit-config");
  if(saved) return JSON.parse(saved);
  return DEFAULTS;
}

function saveSettings(cfg){
  localStorage.setItem("transit-config", JSON.stringify(cfg));
}

/* ================= MENU ================= */

function toggleMenu(){
  document.getElementById("menu").classList.toggle("open");
}

/* ================= AUTOSUGGEST (NEW) ================= */

function attachSuggest(inputEl, boxEl, hiddenIdEl){
  let t;
  inputEl.addEventListener("input", () => {
    const q = inputEl.value.trim();
    if(!q){
      boxEl.style.display = "none";
      boxEl.innerHTML = "";
      return;
    }
    clearTimeout(t);
    t = setTimeout(async () => {
      try {
        const res = await fetch(`https://v6.bvg.transport.rest/locations?query=${encodeURIComponent(q)}&results=5`);
        if (!res.ok) throw new Error(`API returned ${res.status}`);
        const data = await res.json();
        if(!data.length){
          boxEl.style.display = "none";
          return;
        }
        boxEl.innerHTML = data.map((s, i) => `
          <div class="suggest-item" data-id="${s.id}" data-name="${s.name}">
            ${s.name}
          </div>
        `).join("");
        boxEl.style.display = "block";
        
        // ✨ FIX: Use mousedown instead of click (fires before blur)
        [...boxEl.querySelectorAll(".suggest-item")].forEach(item => {
          item.addEventListener("mousedown", (e) => {
            e.preventDefault(); // Prevent input from losing focus
            inputEl.value = item.dataset.name;
            hiddenIdEl.value = item.dataset.id;
            boxEl.style.display = "none";
            boxEl.innerHTML = "";
          });
        });
      } catch(e) {
        console.error(e);
      }
    }, 250);
  });
  
  // Close dropdown when clicking outside
  document.addEventListener("click", (e) => {
    if(!boxEl.contains(e.target) && e.target !== inputEl){
      boxEl.style.display = "none";
    }
  });
}

/* ================= INIT FORM ================= */

function fillForm(cfg){
  alexInput.value = cfg.alex.name;
  alexStopId.value = cfg.alex.stopId;
  alexWalk.value = cfg.alex.walk;
  alexLabel.value = cfg.alex.label;
  
  samInput.value = cfg.sam.name;
  samStopId.value = cfg.sam.stopId;
  samWalk.value = cfg.sam.walk;
  samLabel.value = cfg.sam.label;
}

/* ================= ERROR HANDLING ================= */
let lastError = null;

function showError(context, error) {
  console.error(`[${context}]`, error);
  lastError = {
    context,
    message: error.message || "Network error",
    time: new Date()
  };
  // Show error in UI
  const errorDiv = document.getElementById("errorBanner") || createErrorBanner();
  errorDiv.textContent = `⚠️ ${context}: ${lastError.message}`;
  errorDiv.style.display = "block";
  // Auto-hide after 8 seconds
  setTimeout(() => {
    if (errorDiv) errorDiv.style.display = "none";
  }, 8000);
}

function createErrorBanner() {
  const div = document.createElement("div");
  div.id = "errorBanner";
  div.style.cssText = `
    position: fixed;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--danger);
    color: white;
    padding: 12px 20px;
    border-radius: 4px;
    z-index: 30;
    display: none;
    max-width: 90%;
    text-align: center;
  `;
  document.body.appendChild(div);
  return div;
}

/* ================= API ================= */

async function resolve(q){
  try {
    const r = await fetch(`https://v6.bvg.transport.rest/locations?query=${encodeURIComponent(q)}&results=1`);
    if (!r.ok) throw new Error(`API returned ${r.status}`);
    const d = await r.json();
    if (!d || d.length === 0) throw new Error("Station not found");
    return d[0];
  } catch (e) {
    showError("Station lookup failed", e);
    throw e; // Re-throw so caller knows it failed
  }
}

async function fetchJourneys(fromId, toId){
  try {
    const r = await fetch(`https://v6.bvg.transport.rest/journeys?from=${fromId}&to=${toId}&results=5&stopovers=false`);
    if (!r.ok) throw new Error(`API returned ${r.status}`);
    const d = await r.json();
    return d.journeys || [];
  } catch (e) {
    showError("Journey fetch failed", e);
    return [];
  }
}

/* ================= CORE ================= */

function mins(t){
  return Math.round((new Date(t)-Date.now())/60000);
}

function pick(journeys, walk, cfg){
  return journeys
    .map(j => {
      const depTime = new Date(j.legs[0].departure);
      const arrTime = new Date(j.legs[j.legs.length - 1].arrival);
      const m = mins(depTime);
      return {
        departure: depTime,
        arrival: arrTime,
        duration: Math.round((arrTime - depTime) / 60000),
        m: m,
        walk: walk,
        legs: j.legs.length,
        ...cfg
      };
    })
    .filter(j => j.m >= j.walk) // Only reachable journeys
    .sort((a, b) => a.m - b.m)[0]; // Pick soonest
}

/* ================= UI ================= */

function bars(n){
  return Math.max(1,Math.min(5,5-n));
}

function card(el, item){
  if(!item) {
    el.className = "card";
    el.innerHTML = `
      <div class="title">WAITING FOR DATA</div>
      <div class="big">Loading journeys...</div>
      <div class="small">Checking transit API</div>
    `;
    return;
  }
  const leave = item.m - item.walk;
  const b = bars(leave);
  el.className = `card ${leave <= 1 ? "pulse" : "active"}`;
  el.innerHTML = `
    <div class="title">${item.label}</div>
    <div class="big">${leave <= 1 ? "LEAVE NOW" : `Leave in ${leave} min`}</div>
    <div class="bar-meter ${leave <= 1 ? "critical" : ""}">
      ${Array.from({length:5}).map((_, i) =>
        `<div class="bar ${i < b ? "on" : ""}"></div>`
      ).join("")}
    </div>
    <div class="small">Departs in ${item.m} min • ${item.duration} min trip • ${item.legs} leg${item.legs > 1 ? 's' : ''}</div>
  `;
}

function list(id, journeys, best){
  document.getElementById(id).innerHTML = journeys.slice(0, 6).map(j => {
    const depTime = new Date(j.legs[0].departure);
    const arrTime = new Date(j.legs[j.legs.length - 1].arrival);
    const m = mins(depTime);
    const duration = Math.round((arrTime - depTime) / 60000);
    const isActive = best && Math.abs(depTime - best.departure) < 1000;
    
    // ✨ Extract line names WITH direction
    const lines = j.legs
      .filter(leg => leg.line)
      .map(leg => {
        const lineName = leg.line.name;
        const direction = leg.direction || leg.destination?.name || '';
        return direction ? `${lineName} → ${direction}` : lineName;
      })
      .join(", ");
    
    return `
      <div class="row ${isActive ? "active-row" : ""}">
        <div>${m}m</div>
        <div>${lines || 'Walk'} • ${duration}m</div>
        <div>${depTime.toLocaleTimeString([], {
          hour:"2-digit", minute:"2-digit"
        })}</div>
      </div>
    `;
  }).join("");
}

/* ================= RUN ================= */

async function start(){
  toggleMenu(); // Close menu when startingsync function start(){
  const cfg = loadSettings();
  
  // Use stored stopId if available, otherwise resolve from name
  let alexId = alexStopId.value;
  let samId = samStopId.value;
  
  if (!alexId) {
    try {
      const a = await resolve(alexInput.value);
      alexId = a.id;
    } catch (e) {
      return;
    }
  }
  
  if (!samId) {
    try {
      const s = await resolve(samInput.value);
      samId = s.id;
    } catch (e) {
      return;
    }
  }
  
  CONFIG = {
    alex: {
      stopId: alexId,
      name: alexInput.value,
      walk: +alexWalk.value,
      label: alexLabel.value
    },
    sam: {
      stopId: samId,
      name: samInput.value,
      walk: +samWalk.value,
      label: samLabel.value
    }
  };
  saveSettings(CONFIG);
  
  document.getElementById("alexTitle").innerText = `${CONFIG.alex.name} → ${CONFIG.sam.name}`;
  document.getElementById("samTitle").innerText = `${CONFIG.sam.name} → ${CONFIG.alex.name}`;
  document.getElementById("commutes").innerHTML = `
    <div id="alexCard" class="card"></div>
    <div id="samCard" class="card"></div>
  `;
  
  await load();
  render();
  setInterval(load, 30000);
  setInterval(render, 1000);
}

async function load(){
  const [alexJourneys, samJourneys] = await Promise.all([
    fetchJourneys(CONFIG.alex.stopId, CONFIG.sam.stopId), // A → B
    fetchJourneys(CONFIG.sam.stopId, CONFIG.alex.stopId)  // B → A
  ]);
  
  const ab = pick(alexJourneys, CONFIG.alex.walk, CONFIG.alex);
  const sb = pick(samJourneys, CONFIG.sam.walk, CONFIG.sam);
  
  list("alexList", alexJourneys, ab);
  list("samList", samJourneys, sb);
  
  window._alexBest = ab;
  window._samBest = sb;
}

function render(){
  card(alexCard,window._alexBest);
  card(samCard,window._samBest);
}

/* ================= BOOT ================= */

fillForm(loadSettings());

attachSuggest(alexInput, alexSuggest, alexStopId);
attachSuggest(samInput, samSuggest, samStopId);

start();

</script>

</body>
</html>
